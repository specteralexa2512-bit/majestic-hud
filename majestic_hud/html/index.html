<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Life Roleplay HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main id="hud">
        <section class="server-panel">
            <div class="server-brand">Real Life <span class="brand-name">Roleplay</span><span class="brand-dot">i</span></div>
            <div class="server-meta"><span class="online-dot"></span> Online: <b id="online">0</b> <span class="divider">|</span> 🌴 Orlando</div>
            <div class="server-id">ID: <b id="player-id">0</b> <span class="divider">|</span> #<b id="player-id-copy">0</b></div>
        </section>

        <section class="reward-card">
            <div class="reward-top"><span>BEZAHLTE PRÄMIE</span><b>1/4</b></div>
            <div class="reward-bottom">
                <strong>100</strong>
                <span class="coin">✦</span>
                <span class="free">Kostenlos</span>
                <span class="reward-timer">00:00<small>verbleibend</small></span>
            </div>
        </section>

        <section class="quest-card">
            <div class="quest-heading">ROUTE DES NEULINGS</div>
            <div class="quest-subtitle">Einsteiger-Quests</div>
            <div class="quest-rule"></div>
            <div class="quest-description">Abschluss aller Einsteigeraufgaben</div>
            <div class="quest-progress"><span class="check">✓</span><span>1/4</span></div>
        </section>

        <section class="bottom-left">
            <div class="weather"><span class="sun">☀</span><span>Klar</span><b>25°</b></div>
            <div class="clock"><strong id="clock">20:46</strong><span id="date">Dienstag</span></div>
            <div class="job-line"><span class="job-dot"></span><span id="job">Arbeitslos</span></div>
            <div class="money-line"><span class="cash-icon">▣</span><strong><span id="cash">0</span></strong></div>
            <div class="money-line"><span class="bank-icon">▰</span><strong><span id="bank">0</span></strong></div>
            <div class="status-bars">
                <div class="status-bar health"><span id="health"></span></div>
                <div class="status-bar armor"><span id="armor"></span></div>
                <div class="status-bar hunger"><span id="hunger"></span></div>
                <div class="status-bar thirst"><span id="thirst"></span></div>
            </div>
        </section>

        <section class="speedometer" id="speedometer">
            <div class="speed-row"><span class="gear" id="gear">N</span><span class="speed-number" id="speed">0</span></div>
            <div class="speed-label">KM/H</div>
            <div class="vehicle-details"><span class="engine-icon">◉</span><span class="rpm-track"><i id="rpm"></i></span><span class="fuel-icon">⛽</span><span class="fuel-value" id="fuel">100</span><span class="fuel-percent">%</span></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

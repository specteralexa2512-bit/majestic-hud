<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Life Roleplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud">
        <section class="server-panel">
            <div class="server-brand">Real L<span class="brand-i">i</span>fe Roleplay</div>
            <div class="server-meta"><span class="online-dot"></span>Online: <strong id="online">0</strong><span class="separator">|</span><span class="location">⌖ Deutschland</span></div>
            <div class="server-id">ID: <strong id="player-id">0</strong><span class="separator">|</span>#<strong id="player-id-copy">0</strong></div>
        </section>

        <section class="bottom-left" aria-label="Uhrzeit und Kontostand">
            <div class="weather"><span class="sun-icon" id="weather-icon" aria-hidden="true">☀</span><span id="weather-label">Klar</span><strong id="temperature">25°</strong></div>
            <div class="clock-row"><strong id="clock">--:--</strong><span id="date">--.--.----</span></div>
            <div class="weekday" id="weekday">--</div>
            <div class="job" id="job">Arbeitslos</div>
            <div class="money-row">
                <svg class="money-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15H5a2 2 0 0 1-2-2V6.5A2.5 2.5 0 0 1 5.5 4M3.5 8H20M16 13h4m-4 0a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0Z"/></svg>
                <strong id="cash">0</strong>
            </div>
            <div class="money-row">
                <svg class="money-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-5 9 5M5 10v8m4-8v8m6-8v8m4-8v8M3 20h18M2 22h20"/></svg>
                <strong id="bank">0</strong>
            </div>
        </section>

        <section class="speedometer" id="speedometer" aria-label="Tacho">
            <div class="speed-row"><span class="gear" id="gear">N</span><span class="speed-value" id="speed">0</span></div>
            <div class="speed-unit">KM/H</div>
            <div class="vehicle-row"><span class="rpm-track"><i id="rpm"></i></span><span class="fuel-icon" aria-hidden="true">⛽</span><strong id="fuel">100</strong><span class="percent">%</span></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
